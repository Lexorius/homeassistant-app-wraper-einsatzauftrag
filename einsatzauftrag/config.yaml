# Home-Assistant-App-Konfiguration
# https://contributors.home-assistant.io/apps/reference/configuration/
name: Einsatzauftrag
version: "1.0.0"
slug: einsatzauftrag
description: >-
  Einsatzauftrag (Fb Fü 3) als PDF ausfüllen – einzeln oder aus Excel/CSV.
  Web-App von Johannes Rudolph (wattnpapa), verpackt als Home-Assistant-App.
url: https://github.com/Lexorius/homeassistant-app-wraper-einsatzauftrag
arch:
  - aarch64
  - amd64
# Vorgefertigtes Multi-Arch-Image aus GitHub Actions (.github/workflows/builder.yaml).
# Auskommentieren, wenn das Image stattdessen lokal auf dem HA-Host gebaut werden soll.
image: ghcr.io/lexorius/app-einsatzauftrag
init: false
startup: application
boot: auto
# Die App läuft komplett im Browser, braucht weder Ports nach außen
# noch Zugriff auf Home-Assistant-APIs.
hassio_api: false
homeassistant_api: false
host_network: false
# Ingress: Die App erscheint in der Seitenleiste von Home Assistant und wird
# über dessen Anmeldung abgesichert. Kein eigener Port nach außen nötig.
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-edit-outline
panel_title: Einsatzauftrag
panel_admin: false
# Der Supervisor prüft regelmäßig, ob nginx antwortet, und startet sonst neu.
watchdog: "http://[HOST]:[PORT:8099]/"
options: {}
schema: {}
