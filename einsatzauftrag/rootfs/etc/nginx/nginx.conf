# nginx-Konfiguration für das Add-on „Einsatzauftrag“.
# Liefert ausschließlich statische Dateien aus /var/www/einsatzauftrag.

worker_processes  1;
pid               /run/nginx/nginx.pid;
error_log         /proc/self/fd/2 warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Zugriffs-Log auf stdout, damit es im Add-on-Protokoll erscheint.
    log_format    kurz '$remote_addr "$request" $status $body_bytes_sent';
    access_log    /proc/self/fd/1 kurz;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip          on;
    gzip_vary     on;
    gzip_min_length 1024;
    gzip_types    text/plain text/css application/javascript application/json
                  application/manifest+json image/svg+xml font/woff2;

    server {
        listen 8099 default_server;
        server_name _;

        # Wer zugreifen darf, schreibt run.sh beim Start (Ingress-Proxy oder alle).
        include /etc/nginx/zugriff.conf;

        root  /var/www/einsatzauftrag;
        index index.html;

        # Ingress bettet die App in ein iframe der Home-Assistant-Oberfläche ein.
        # Dafür darf nginx kein X-Frame-Options setzen (tut es standardmäßig nicht).

        # Einstiegsseite und Service Worker nie cachen, damit eine neue Fassung
        # sofort ankommt. Die Datei-Liste im Service Worker ist versioniert.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = /sw.js {
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Vite hängt einen Inhalts-Hash an die Dateinamen, die dürfen lange im Cache bleiben.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
