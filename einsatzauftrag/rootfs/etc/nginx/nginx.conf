# nginx-Konfiguration für die App „Einsatzauftrag“.
# Liefert ausschließlich statische Dateien aus /var/www/einsatzauftrag.
# Läuft als unprivilegierter Nutzer „nginx“ (siehe run.sh), daher keine user-Direktive.

worker_processes  1;
pid               /run/nginx/nginx.pid;
error_log         stderr warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Kein Zugriffs-Log: Als unprivilegierter Nutzer kann nginx die stdout-Pipe des
    # Containers nicht öffnen, und unter Ingress kämen ohnehin alle Anfragen vom
    # Supervisor-Proxy. Fehler gehen über den geerbten stderr-Deskriptor ins Protokoll.
    access_log    off;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Es gibt keine Uploads zum Server, also knapp bemessen.
    client_max_body_size        1k;
    client_body_buffer_size     1k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                30s;
    keepalive_timeout           65s;

    gzip          on;
    gzip_vary     on;
    gzip_min_length 1024;
    gzip_types    text/plain text/css application/javascript application/json
                  application/manifest+json image/svg+xml font/woff2;

    server {
        listen 8099 default_server;
        server_name _;

        # Wer zugreifen darf, schreibt run.sh beim Start (Ingress-Proxy oder alle).
        include /run/nginx/zugriff.conf;

        # Nur Lesezugriffe.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        root  /var/www/einsatzauftrag;
        index index.html;

        # Versteckte Dateien nie ausliefern.
        location ~ /\. {
            return 404;
        }

        # Einstiegsseiten und Service Worker nie cachen, damit eine neue Fassung
        # sofort ankommt. Die Datei-Liste im Service Worker ist versioniert.
        location ~ ^/(index|impressum|datenschutz)\.html$ {
            include /etc/nginx/snippets/sicherheit.conf;
            add_header Cache-Control "no-cache";
        }
        location = /sw.js {
            include /etc/nginx/snippets/sicherheit.conf;
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            include /etc/nginx/snippets/sicherheit.conf;
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Vite hängt einen Inhalts-Hash an die Dateinamen, die dürfen lange im Cache bleiben.
        location /assets/ {
            include /etc/nginx/snippets/sicherheit.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            include /etc/nginx/snippets/sicherheit.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
