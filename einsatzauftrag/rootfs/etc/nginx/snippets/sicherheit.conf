# Sicherheits-Header, in jeder location eingebunden (nginx vererbt add_header
# nicht in locations, die selbst add_header verwenden).
#
# Kein X-Frame-Options und kein frame-ancestors: Home Assistant bettet die App
# per Ingress in ein iframe seiner eigenen Oberfläche ein.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy: beim Image-Bau aus den Inline-Blöcken der HTML-Seiten
# erzeugt (nachbearbeiten.mjs), deshalb ohne 'unsafe-inline'.
include /etc/nginx/snippets/csp.conf;
