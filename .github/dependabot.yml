# Hält die gepinnten GitHub Actions und die Basisimages im Dockerfile aktuell.
# Die App-Abhängigkeiten selbst liegen im Upstream-Repository (wattnpapa/einsatzauftrag)
# und werden bei jedem Bau frisch von dort geholt und mit „npm audit“ geprüft.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: [abhaengigkeiten, ci]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/einsatzauftrag"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: [abhaengigkeiten, docker]
    commit-message:
      prefix: "docker"
